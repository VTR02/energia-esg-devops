spring.application.name=energia-ms

server.port=8081

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:oracle}

spring.jpa.hibernate.ddl-auto=update

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:5050/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
