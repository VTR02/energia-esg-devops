name: CI/CD Energia ESG

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  build-eureka:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eureka-server/eureka-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Build Eureka
        run: ./mvnw clean package -DskipTests

      - name: Testes Eureka
        run: ./mvnw test


  build-energia:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: energia-ms/energia-ms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Build Energia MS
        run: ./mvnw clean package -DskipTests

      - name: Testes Energia MS
        run: ./mvnw test


  docker-build:
    runs-on: ubuntu-latest

    needs:
      - build-eureka
      - build-energia

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Eureka
        run: docker build -t energia-eureka ./eureka-server/eureka-server

      - name: Build Docker Energia
        run: docker build -t energia-ms ./energia-ms/energia-ms